image:
  repository: didin8080/frappe-build-test
  tag: "1"
  pullPolicy: IfNotPresent

mariadb:
  enabled: false
mariadb-subchart:
  enabled: false

dbHost: "192.168.1.133"
dbPort: 6033
dbRootUser: "appuser"
dbExistingSecret: "proxysql-root-secret"
dbExistingSecretPasswordKey: "mariadb-root-password"

persistence:
  worker:
    enabled: true
    storageClass: "local-path"
    accessModes:
     - ReadWriteOnce

jobs:
  configureBench:
    enabled: true
  createSite:
    enabled: false
  createMultipleSites:
    enabled: true
    dbType: "mariadb"
    adminPassword: "Bizaxltest"
    sites:
      - name: "site.testsite"
        installApps: []
      - name: "openstack.site"
        installApps: []
      - name: "banglore.site"
        installApps: []
  migrateMultipleSites:
    enabled: true
    skipFailing: false
    sites:
      - name: "site.testsite"
      - name: "openstack.site"
      - name: "banglore.site"
    backoffLimit: 0
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/upstream-vhost: "$host"
  hosts:
    - host: site.testsite
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: blacky.testsite
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: openstack.site
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: banglore.site
      paths:
        - path: /
          pathType: ImplementationSpecific
nginx:
  topologySpreadConstraints:
    - maxSkew: 2
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: erpnext-nginx
          app.kubernetes.io/instance: erpnext-prod-nginx

worker:
  topologySpreadConstraints:
    - maxSkew: 2
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: erpnext-gunicorn
          app.kubernetes.io/instance: erpnext-prod-gunicorn

valkey-cache:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
valkey-queue:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
