image:
  repository: didin8080/frappe-build-test
  tag: "1"
  pullPolicy: IfNotPresent

mariadb:
  enabled: false
mariadb-subchart:
  enabled: false

dbHost: "192.168.0.133"
dbPort: 3306
dbRootUser: "appuser"
dbExistingSecret: "proxysql-root-secret"
dbExistingSecretPasswordKey: "mariadb-root-password"

persistence:
  worker:
    enabled: true
    storageClass: "nfs-client"

jobs:
  configureBench:
    enabled: true
  createSite:
    enabled: false
  createMultipleSites:
    enabled: true
    dbType: "mariadb"
    adminPassword: "Bizaxltest"
    sites:
      - name: "site11.company.local"
        installApps: ["erpnext","hrms","payments"]
      - name: "site12.company.local"
        installApps: ["erpnext","hrms","payments"]
#  migrateMultipleSites:
 #   enabled: true
  #  skipFailing: false
   # sites:
    #  - name: "site1.company.local"
    #  - name: "site2.company.local"
    #  - name: "site3.company.local"
    #  - name: "site4.company.local"
    #  - name: "site5.company.local"
    #  - name: "site6.company.local"
    backoffLimit: 0
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/upstream-vhost: "$host"
  hosts:
    - host: site1.company.local
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: site2.company.local
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: site3.company.local
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: site4.company.local
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: site5.company.local
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: site6.company.local
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: site7.company.local
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: site8.company.local
      paths:
        - path: /
          pathType: ImplementationSpecific
nginx:
  topologySpreadConstraints:
    - maxSkew: 2
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: erpnext-nginx
          app.kubernetes.io/instance: erpnext-prod-nginx

worker:
  topologySpreadConstraints:
    - maxSkew: 2
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: erpnext-gunicorn
          app.kubernetes.io/instance: erpnext-prod-gunicorn

valkey-cache:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
valkey-queue:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
