image:
  repository: didin8080/frappe-build-test
  tag: "1"
  pullPolicy: IfNotPresent

mariadb:
  enabled: false
mariadb-subchart:
  enabled: false

# ---- ProxySQL: used by the apps, by configureBench and by the validate-config init container ----
dbHost: "proxysql.database.svc.cluster.local"
dbPort: 6033
dbRootUser: "frappe_admin"
dbExistingSecret: "frappe-db-root"
dbExistingSecretPasswordKey: "password"

# ---- Direct Galera: used ONLY by `bench new-site` (bypasses ProxySQL) ----
galeraHost: "192.168.0.151"   # CHANGE ME: your real Galera service / VIP
galeraPort: 3306

# ---- Secret holding the ProxySQL sync credentials (must exist in this release's namespace) ----
# keys: sync_user, sync_password, radmin_user, radmin_password
proxysqlSync:
  existingSecret: "proxysql-sync"

persistence:
  worker:
    enabled: true
    storageClass: "ceph-filesystem"
    accessModes:
      - ReadWriteMany

jobs:
  configureBench:
    enabled: true

  # Keep disabled. If this is true, createMultipleSites is suppressed
  # (the multi-site template has `not createSite.enabled` in its condition).
  createSite:
    enabled: false

  createMultipleSites:
    enabled: false
    jobName: "erpnext-create-sites"   # fixed name instead of the timestamp name
    dbType: "mariadb"
    backoffLimit: 3                   # safe: the script is idempotent
    forceCreate: false                # never set true in production, --force drops an existing site
    adminPassword: "Bizaxltest"       # better: use the existing-secret pair below
    # adminExistingSecret: "frappe-site-admin"
    # adminExistingSecretKey: "password"
    annotations:
      helm.sh/hook: post-install,post-upgrade
      helm.sh/hook-delete-policy: before-hook-creation
    sites:
      - name: "galera1.site"
        installApps: []
      - name: "galera2.site"
        installApps: []

  migrateMultipleSites:
    enabled: true
    skipFailing: false
    backoffLimit: 0
    sites:                            # list only sites that already exist
      - name: "galera2.site"

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/upstream-vhost: "$host"
  hosts:
    - host: galera1.site
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: galera2.site
      paths:
        - path: /
          pathType: ImplementationSpecific

nginx:
  topologySpreadConstraints:
    - maxSkew: 2
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: erpnext-nginx
          app.kubernetes.io/instance: erpnext-prod-nginx

worker:
  topologySpreadConstraints:
    - maxSkew: 2
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: erpnext-gunicorn
          app.kubernetes.io/instance: erpnext-prod-gunicorn

valkey-cache:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits:   {cpu: 200m, memory: 256Mi}
valkey-queue:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits:   {cpu: 200m, memory: 256Mi}
