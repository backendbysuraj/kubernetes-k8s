image:
  repository: didin8080/frappe-build-test
  tag: "1"
  pullPolicy: IfNotPresent

mariadb:
  enabled: false
mariadb-subchart:
  enabled: false

dbHost: "proxysql.database.svc.cluster.local"
dbPort: 6033
dbRootUser: "frappe_admin"
dbExistingSecret: "frappe-db-root"
dbExistingSecretPasswordKey: "password"

#dbHost: "192.168.1.133"
#dbPort: 6033
#dbRootUser: "appuser"
#dbExistingSecret: "proxysql-root-secret"
#dbExistingSecretPasswordKey: "mariadb-root-password"

persistence:
  worker:
    enabled: true
    storageClass: "ceph-filesystem"
    accessModes:
     - ReadWriteMany

jobs:
  configureBench:
    enabled: true
  createSite:
    enabled: false
  createMultipleSites:
    enabled: true
    dbType: "mariadb"
    adminPassword: "Bizaxltest"
    sites:
#      - name: "blackpink.site"
#        installApps: []
      - name: "galera1.site"
        installApps: []
  migrateMultipleSites:
    enabled: true
    skipFailing: false
    sites:
