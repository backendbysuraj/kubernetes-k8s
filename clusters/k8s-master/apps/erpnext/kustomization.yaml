apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: erpnext
resources:
  - namespace.yaml
  - source.yaml
  - helmrelease.yaml
  - backup-cronjob.yaml
  - create-sites-job.yaml          # new
configMapGenerator:
  - name: erpnext-values
    files:
      - values.yaml
  - name: erpnext-hpa-values
    files:
      - hpa-values.yaml
  - name: proxysql-scripts         # new
    files:
      - scripts/ensure-proxysql-user.sh
      - scripts/finalize-site.sh
generatorOptions:
  disableNameSuffixHash: true
